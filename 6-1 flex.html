<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing: border-box;
        }
        body{
            padding:30px;
            background:#f4f6f9;
        }
        h2{
            margin-bottom:30px;
        }
        /*外层，放4个demo盒子横向排开*/
        .out-flex{
            display:flex;
            gap:20px;
        }
        /*每个演示外框*/
        .demo{
            width:220px;
            height:260px;
            border:1px solid #666;
            background:#fff;
            padding:10px;
        }
        .item{
            background:#dddddd;
            border:1px solid #222;
        }

        /*demo1：单个方块居中*/
        .demo1{
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .demo1 .item{
            width:70px;
            height:70px;
        }

        /*demo2：上下两个块*/
        .demo2{
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:12px;
        }
        .demo2 .item{
            width:130px;
            height:65px;
        }

        /*demo3：四格2*2*/
        .demo3{
            display:flex;
            flex-wrap:wrap;
            justify-content:space-between;
            align-content:space-between;
        }
        .demo3 .item{
            width:47%;
            height:47%;
        }

        /*demo4：上面通栏，下面两个并排*/
        .demo4{
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .row-inner{
            display:flex;
            gap:12px;
        }
        .demo4 .item-top{
            width:100%;
            height:85px;
        }
        .demo4 .item-bot{
            flex-grow:1;
            height:85px;
        }
    </style>
</head>
<body>
    <h2>药恩祈 flex</h2>
    <div class="out-flex">
        <!--样例1-->
        <div class="demo demo1">
            <div class="item"></div>
        </div>
        <!--样例2-->
        <div class="demo demo2">
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <!--样例3-->
        <div class="demo demo3">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <!--样例4-->
        <div class="demo demo4">
            <div class="item item-top"></div>
            <div class="row-inner">
                <div class="item item-bot"></div>
                <div class="item item-bot"></div>
            </div>
        </div>
    </div>
</body>
</html>
