<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            margin: 10px;
            display: flex;
            flex-wrap: wrap;
            background-color: #f0f0f0;
        }
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
            margin: 5px;
            background-color: #fff;
            font-size: 24px;
            display:flex;
            align-items: center;   /* 垂直居中 */
            justify-content:center;
            transition: all 0.9s ease;
            box-sizing: border-box; /* width和height包含border和padding，不包含margin */
        }
        .box:first-child:hover {
            background-color: #5f9ea0;
            color: #fff;
            font-size: 80px;
            border-width:30px;
        }
        .box:nth-child(2):hover{
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }
        .box:nth-child(3):hover{
            text-shadow: 5px 0px 10px rgba(0, 0, 0, 0.5);
        }
        .box:nth-of-type(4):hover{
            border-radius:50%;
        }
        .box:nth-of-type(5){
            /*线性渐变*/
            background:linear-gradient(#000,#fff);
        }
        .box:nth-of-type(6){
            /*径向渐变*/
            background:radial-gradient(#fff,#000);
        }
        /*~兄弟选择器*/
        .box:nth-of-type(6)+.box:hover{
            transform:scale(0.5);
        }
        .box:nth-of-type(8):hover{
            transform:translateX(100px);
        }
        .box:nth-of-type(9):hover{
            transform:rotateX(-180deg);
        }
        .box:nth-of-type(10):hover{
            transform:skewX(-45deg);
        }
        .box:nth-last-child(2):hover::before{
            content:"#";
            color:red;
            display:flex;
            margin-right:5px;
        }
        .box:last-child:hover::after{
            content:"药恩祈";
            color:bisque;
            font-size:14px;
            display:block;
            width:80px;
            height:40px;
            line-height:40px;
            text-align:center;
            background:#000;
            border-radius:8px;
            margin:10px;
        }
        .box:nth-of-type(3n):hover{
            border:3px solid rgb(111, 81, 81);
        }
        /*扩展：鼠标在偶数个盒子上时有变化，效果：变色+放大*/
        .box:nth-child(even):hover{
            background-color: #b4e0f5;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
