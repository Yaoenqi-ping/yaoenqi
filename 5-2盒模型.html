<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型，box，model</title>
    <style>
        body,h2,ul,p{
            padding:0;
            margin:0;
        }
       #a{
        width:400px;
        height:400px;
        border:1px solid #039;
        padding:50px 40px 30px 20px;/*上 右 下 左*/
        margin:40px auto;
       }
       #b{
        width:400px;
        height:400px;
        border:1px dashed #039;
        margin:50px auto 40px;
        border-left: 1PX dotted #039;
    }
    /*扩展：完成c和d，边框用dooted，宽度为3px*/

    #c{
        width:400px;
        height:400px;
        border:3px dotted #039;
        margin:50px auto 40px;
    }
    #d{
        width:400px;
        height:400px;
        border:3px dotted #039;
        margin:50px auto 40px;
    }
    </style>
</head>
<body>
   <div id="a">631药恩祈</div>
   <div id="b">631药恩祈</div>
   <div id="c">631药恩祈</div>
   <div id="d">631药恩祈</div>

</body>
</html>
