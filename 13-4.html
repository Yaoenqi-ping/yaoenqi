<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4fbfa" />
  <title>13-4 移动端底部导航（SVG 图标）</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      --accent: #0d9488;
      --accent-soft: #e4f6f3;
      --ink: #1f3038;
      --muted: #8499a0;
      --line: #e4efed;
      --tabbar-height: 62px;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #e6f0ee;
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: linear-gradient(180deg, #f4fbfa 0%, #f1f8f7 42%, #edf5f4 100%);
      padding: 0 18px calc(var(--tabbar-height) + 34px + env(safe-area-inset-bottom));
      box-shadow: 0 0 40px rgba(20, 62, 58, 0.08);
      position: relative;
    }

    .svg-icon {
      width: 1em;
      height: 1em;
      fill: currentColor;
      display: inline-block;
      vertical-align: -0.125em;
      overflow: hidden;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 0 16px;
      background: rgba(244, 251, 250, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .greeting {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .app-header h1 {
      font-size: 23px;
      color: var(--ink);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tech-tag {
      font-size: 10px;
      font-weight: normal;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 3px 8px;
      letter-spacing: 0.5px;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .header-btn:active {
      transform: scale(0.92);
    }

    .header-btn .svg-icon {
      width: 20px;
      height: 20px;
    }

    .top-nav {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .top-nav::-webkit-scrollbar {
      display: none;
    }

    .top-nav-item {
      position: relative;
      flex: 0 0 auto;
      padding: 8px 9px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      border-radius: 10px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .top-nav-item:active {
      background: var(--accent-soft);
    }

    .top-nav-item.active {
      color: var(--accent);
      font-weight: 600;
    }

    .top-nav-item.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 16px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
      transform: translateX(-50%);
    }

    .header-slot {
      position: relative;
      flex: 0 0 auto;
    }

    .more-menu {
      position: absolute;
      top: 48px;
      left: 0;
      z-index: 30;
      min-width: 132px;
      padding: 6px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px rgba(20, 62, 58, 0.16);
    }

    .more-menu button {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
    }

    .more-menu button:active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .search-panel {
      margin-bottom: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 4px 14px rgba(20, 62, 58, 0.05);
    }

    .search-box .svg-icon {
      width: 17px;
      height: 17px;
      color: var(--muted);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
    }

    .search-box input::placeholder {
      color: #a4b6b4;
    }

    .search-close {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .search-close .svg-icon {
      width: 16px;
      height: 16px;
    }

    .empty-tip {
      padding: 14px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 10px;
      height: 25vh;
      min-height: 190px;
      margin-bottom: 26px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 18px 14px;
      border-radius: 20px;
      color: #fff;
      background-color: #2c6f6a;
      background-image: linear-gradient(180deg, rgba(12, 22, 44, 0.08) 25%, rgba(12, 22, 44, 0.82) 100%), url("img/推荐1.jpg");
      background-size: cover;
      background-position: 42% center;
      background-repeat: no-repeat;
      box-shadow: 0 10px 22px rgba(13, 148, 136, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hero-card:active {
      transform: scale(0.97);
    }

    .hero-card:nth-child(2) {
      background-image: linear-gradient(180deg, rgba(12, 22, 44, 0.08) 25%, rgba(12, 22, 44, 0.82) 100%), url("img/推荐2.jpg");
      background-position: 38% center;
      box-shadow: 0 10px 22px rgba(74, 122, 232, 0.2);
    }

    .hero-card:nth-child(3) {
      background-image: linear-gradient(180deg, rgba(12, 22, 44, 0.08) 25%, rgba(12, 22, 44, 0.82) 100%), url("img/推荐3.jpg");
      background-position: 50% center;
      box-shadow: 0 10px 22px rgba(240, 102, 63, 0.2);
    }


    .hero-card h2 {
      position: relative;
      z-index: 1;
      font-size: 16px;
      letter-spacing: 0.5px;
      margin-top: auto;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    }

    .hero-card p {
      position: relative;
      z-index: 1;
      padding-right: 24px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.4;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-head h2 {
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .section-head a {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }

    .section-head .svg-icon {
      width: 14px;
      height: 14px;
    }

    .rank-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .rank-card {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      padding: 12px;
      border-radius: 20px;
      color: #fff;
      text-align: center;
      box-shadow: 0 10px 22px rgba(230, 78, 134, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .rank-card::before,
    .rank-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
    }

    .rank-card::before {
      width: 78px;
      height: 78px;
      top: -30px;
      right: -24px;
    }

    .rank-card::after {
      width: 46px;
      height: 46px;
      bottom: -20px;
      left: -14px;
      background: rgba(255, 255, 255, 0.1);
    }

    .rank-card:active {
      transform: scale(0.97);
    }

    .rank-card h3 {
      position: relative;
      z-index: 1;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
    }

    .rank-card.rank-pink {
      background-image: linear-gradient(145deg, #f78bb0 0%, #e64e86 100%);
    }

    .rank-card.rank-blue {
      background-image: linear-gradient(145deg, #2f5fa8 0%, #16305e 100%);
      box-shadow: 0 10px 22px rgba(22, 48, 94, 0.3);
    }

    .rank-card.rank-orange {
      background-image: linear-gradient(145deg, #ffa94d 0%, #f07c27 100%);
      box-shadow: 0 10px 22px rgba(240, 124, 39, 0.25);
    }

    .play-mark {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: transparent;
      pointer-events: none;
    }

    .play-mark::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #fff;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.28));
    }

    .rank-grid .empty-tip {
      grid-column: 1 / -1;
      padding: 6px 0;
    }

    .tabbar {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 100;
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: stretch;
      padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -8px 24px rgba(20, 62, 58, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .tab-item {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 3px 0 1px;
      text-decoration: none;
      color: #8ba09e;
      font-size: 11px;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
    }

    .tab-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 28px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .tab-icon {
      width: 23px;
      height: 23px;
      display: block;
      transition: transform 0.2s ease;
    }

    .tab-label {
      line-height: 1.4;
      transition: font-weight 0.2s ease;
    }

    .tab-item.active {
      color: var(--accent);
      font-weight: 600;
    }

    .tab-item.active .tab-icon-wrap {
      background: var(--accent-soft);
    }

    .tab-item.active .tab-icon {
      transform: translateY(-1px);
    }

    .tab-item:not(.active):active .tab-icon-wrap {
      background: #f0f5f4;
    }

    .badge {
      position: absolute;
      top: -5px;
      right: -7px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: #ff3b30;
      border: 2px solid #fff;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 13px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(255, 59, 48, 0.35);
    }

    .dot {
      position: absolute;
      top: -1px;
      right: -3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b30;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(255, 59, 48, 0.4);
    }

    @media (max-width: 360px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .tab-item {
        font-size: 10px;
      }

      .tab-icon {
        width: 21px;
        height: 21px;
      }

      .tab-icon-wrap {
        width: 38px;
      }

      .header-btn {
        width: 36px;
        height: 36px;
        border-radius: 12px;
      }

      .top-nav-item {
        padding: 8px 6px;
        font-size: 12px;
      }

      .hero-grid {
        gap: 8px;
        min-height: 170px;
      }

      .hero-card {
        padding: 14px 11px;
        border-radius: 16px;
      }

      .hero-card h2 {
        font-size: 15px;
      }

      .hero-card p {
        font-size: 9px;
      }

      .rank-grid {
        gap: 8px;
      }

      .rank-card {
        padding: 10px;
        border-radius: 16px;
      }

      .rank-card h3 {
        font-size: 13px;
      }
    }

    @media (min-width: 481px) {
      body {
        padding: 24px 0;
      }

      .app {
        min-height: calc(100vh - 48px);
        border-radius: 26px;
        overflow: hidden;
      }

      .tabbar {
        bottom: 24px;
        border-radius: 18px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(20, 62, 58, 0.16);
      }
    }
  </style>
</head>
<body>
  <script src="font/iconfont.js"></script>

  <div class="app">
    <header class="app-header">
      <div class="header-slot">
        <button class="header-btn" id="moreBtn" type="button" aria-label="更多" aria-expanded="false">
          <svg class="svg-icon" aria-hidden="true"><use href="#icon-gengduo"></use></svg>
        </button>
        <div class="more-menu" id="moreMenu" hidden>
          <button type="button">新建笔记</button>
          <button type="button">刷新推荐</button>
          <button type="button">设置</button>
        </div>
      </div>
      <nav class="top-nav" aria-label="内容导航">
        <a class="top-nav-item active" href="#" aria-current="page">心动</a>
        <a class="top-nav-item" href="#">推荐</a>
        <a class="top-nav-item" href="#">音乐</a>
        <a class="top-nav-item" href="#">播客</a>
        <a class="top-nav-item" href="#">听书</a>
      </nav>
      <button class="header-btn" id="searchBtn" type="button" aria-label="搜索" aria-expanded="false">
        <svg class="svg-icon" aria-hidden="true"><use href="#icon-sousuo"></use></svg>
      </button>
    </header>

    <div class="search-panel" id="searchPanel" hidden>
      <div class="search-box">
        <svg class="svg-icon" aria-hidden="true"><use href="#icon-sousuo"></use></svg>
        <input id="searchInput" type="search" placeholder="搜索笔记、歌手、播客" aria-label="搜索" />
        <button class="search-close" id="searchClose" type="button" aria-label="关闭搜索">
          <svg class="svg-icon" aria-hidden="true"><use href="#icon-shanchu"></use></svg>
        </button>
      </div>
    </div>

    <section class="hero-grid" aria-label="今日推荐">
      <article class="hero-card">
        <h2>每日推荐</h2>
        <p>今日限定好歌</p>
        <span class="play-mark" aria-hidden="true"></span>
      </article>
      <article class="hero-card">
        <h2>雷达歌单</h2>
        <p>反复聆听你爱的歌</p>
        <span class="play-mark" aria-hidden="true"></span>
      </article>
      <article class="hero-card">
        <h2>心动模式</h2>
        <p>红心歌曲和相似推荐</p>
        <span class="play-mark" aria-hidden="true"></span>
      </article>
    </section>

    <div class="section-head">
      <h2>排行榜&gt;</h2>
      <a href="#" aria-label="查看全部榜单">查看全部<svg class="svg-icon" aria-hidden="true"><use href="#icon-gengduo"></use></svg></a>
    </div>

    <div class="rank-grid">
      <article class="rank-card rank-pink">
        <h3>中文说唱榜</h3>
        <span class="play-mark" aria-hidden="true"></span>
      </article>
      <article class="rank-card rank-blue">
        <h3>欧美新歌榜</h3>
        <span class="play-mark" aria-hidden="true"></span>
      </article>
      <article class="rank-card rank-orange">
        <h3>星云榜</h3>
        <span class="play-mark" aria-hidden="true"></span>
      </article>
    </div>

    <nav class="tabbar" aria-label="底部导航">
      <a class="tab-item active" href="#" data-title="首页" aria-current="page">
        <span class="tab-icon-wrap">
          <svg class="svg-icon tab-icon" aria-hidden="true"><use href="#icon-wangyiyun11"></use></svg>
        </span>
        <span class="tab-label">首页</span>
      </a>
      <a class="tab-item" href="#" data-title="漫游">
        <span class="tab-icon-wrap">
          <svg class="svg-icon tab-icon" aria-hidden="true"><use href="#icon-wuqiong"></use></svg>
          <span class="dot" aria-label="有新内容"></span>
        </span>
        <span class="tab-label">漫游</span>
      </a>
      <a class="tab-item" href="#" data-title="笔记">
        <span class="tab-icon-wrap">
          <svg class="svg-icon tab-icon" aria-hidden="true"><use href="#icon-bijijilu"></use></svg>
          <span class="badge" aria-label="6 条未读">6</span>
        </span>
        <span class="tab-label">笔记</span>
      </a>
      <a class="tab-item" href="#" data-title="我的">
        <span class="tab-icon-wrap">
          <svg class="svg-icon tab-icon" aria-hidden="true"><use href="#icon-wode"></use></svg>
        </span>
        <span class="tab-label">我的</span>
      </a>
    </nav>
  </div>

  <script>
    (function () {
      var tabs = document.querySelectorAll(".tab-item");
      var topNavItems = document.querySelectorAll(".top-nav-item");
      var moreBtn = document.getElementById("moreBtn");
      var moreMenu = document.getElementById("moreMenu");
      var searchBtn = document.getElementById("searchBtn");
      var searchPanel = document.getElementById("searchPanel");
      var searchInput = document.getElementById("searchInput");
      var searchClose = document.getElementById("searchClose");
      var rankCards = document.querySelectorAll(".rank-card");
      var rankGrid = document.querySelector(".rank-grid");

      var emptyTip = document.createElement("p");
      emptyTip.className = "empty-tip";
      emptyTip.textContent = "没有找到相关榜单";
      emptyTip.hidden = true;
      rankGrid.appendChild(emptyTip);

      tabs.forEach(function (tab) {
        tab.addEventListener("click", function (event) {
          event.preventDefault();
          tabs.forEach(function (item) {
            item.classList.remove("active");
            item.removeAttribute("aria-current");
          });
          tab.classList.add("active");
          tab.setAttribute("aria-current", "page");
        });
      });

      topNavItems.forEach(function (item) {
        item.addEventListener("click", function (event) {
          event.preventDefault();
          topNavItems.forEach(function (nav) {
            nav.classList.remove("active");
            nav.removeAttribute("aria-current");
          });
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
        });
      });

      moreBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        var open = moreMenu.hidden;
        moreMenu.hidden = !open;
        moreBtn.setAttribute("aria-expanded", String(open));
      });

      moreMenu.addEventListener("click", function (event) {
        if (event.target.tagName === "BUTTON") {
          moreMenu.hidden = true;
          moreBtn.setAttribute("aria-expanded", "false");
        }
      });

      document.addEventListener("click", function () {
        moreMenu.hidden = true;
        moreBtn.setAttribute("aria-expanded", "false");
      });

      function filterRankings(keyword) {
        var q = keyword.trim().toLowerCase();
        var visible = 0;
        rankCards.forEach(function (card) {
          var match = !q || card.textContent.toLowerCase().indexOf(q) !== -1;
          card.hidden = !match;
          if (match) {
            visible++;
          }
        });
        emptyTip.hidden = visible !== 0;
      }

      function openSearch() {
        searchPanel.hidden = false;
        searchBtn.setAttribute("aria-expanded", "true");
        searchInput.focus();
      }

      function closeSearch() {
        searchPanel.hidden = true;
        searchBtn.setAttribute("aria-expanded", "false");
        searchInput.value = "";
        filterRankings("");
      }

      searchBtn.addEventListener("click", function () {
        if (searchPanel.hidden) {
          openSearch();
        } else {
          closeSearch();
        }
      });

      searchClose.addEventListener("click", closeSearch);

      searchInput.addEventListener("input", function () {
        filterRankings(searchInput.value);
      });

      searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeSearch();
        }
      });
    })();
  </script>
</body>
</html>
