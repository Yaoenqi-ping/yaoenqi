<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0;
            margin:0;
        }
        ul{
            list-style:none;
        }
        img{
            display: block;
            width:100%;
        }
        .list{
            display:flex;
        }
        .list li{
            flex:1;
            margin-right:3px;
            position:relative;
        }
        /* 最后一个li取消右边距 */
        .list li:last-child{
            margin-right:0;
        }
        .list p{
            text-align:center;
            font-size:14px;
            line-height:33px;
            position:absolute;
            left:0;
            bottom:0;
            width:100%;
            background-color: rgba(120,20,20,0.75);
            color:#fff;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <ul class="list">
         <li><img src="./img/1.jpg" alt=""><p>药恩祈的上图下文</p></li>
         <li><img src="./img/2.jpg" alt=""><p>图片2</p></li>
         <li><img src="./img/3.jpg" alt=""><p>图片3</p></li>
    </ul>
</body>
</html>
