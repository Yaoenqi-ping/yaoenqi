<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .title{
            display:flex;
            justify-content: space-between;
            align-items: center;
            width:500px;
            height:33px;
            line-height:33px;
            margin:50px;
        }
        .title h2{
            font-size: 14px;
            padding-left:10px; 
            padding:0;
            margin:0;   
        }
        .title a{
            font-size:12px;
            color:#666;
            text-decoration:none;
            margin-right:16px;
        }
        
        .title:first-child{
           border:1px solid #666;
        }
        
        .title:nth-child(2){
            border-top:1px solid #666;
        }
        
        .title:nth-child(3){
           border-bottom: 1px solid #666;
        }
    </style>
</head>
<body>
    <div class="title">
        <h2>药恩祈的标题</h2>
        <a href="#">更多</a>
    </div>

</body>
</html>
