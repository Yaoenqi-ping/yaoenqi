<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>631药恩祈</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }     /*群组选择器*/
        #box{
            width:480px;
            padding:8px;
            border:1px solid #ccc;  /*边框*/
            font-size:12px;
            margin:20px;
        }
        #box h3{
            font-size:16px;
            text-align:center;
            /*行高33px*/
            line-height:33px;
            /*字间距3px*/
            letter-spacing:3px;
            color:#036;
        }
        #box p{
            /*行高150%*/
            line-height:150%;
            color:#666;
            /*首行缩进2em*/
            text-indent:2em;
        }
        #box a{
            color:rgb(155, 24, 35);
            text-decoration:none;
            /*加粗*/
            font-weight:bold;
        }
        .yname{
            /*深色加粗*/
            color:#222;
            font-weight:bold;
        }
        .stu-id{
            /*学号蓝色加粗*/
            color:blue;
            font-weight:bold;
        }
        .level{
            /*难度红色加粗*/
            color:red;
            font-weight:bold;
        }
        .know-point{
            /*知识点紫色边框，额外内容（content‑box）*/
            border:2px solid purple;
            box-sizing:content-box;
            padding:2px 4px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号:<span class="stu-id">631</span>，姓名：<span class="yname">药恩祈</span>， 班级:计算机24006， 对于《高级网页设计》课程的难度认知为：<span class="level">难</span>，
            这个例子对应的知识点是：<span class="know-point">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多</a>
        </p>
    </div>
</body>
</html>
